name: movieapp-prod

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${PROD_DB_ROOT_PASSWORD:?Set PROD_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PROD_DB_NAME:-movie_db}
      MYSQL_USER: ${PROD_DB_USER:-movieapp}
      MYSQL_PASSWORD: ${PROD_DB_PASSWORD:?Set PROD_DB_PASSWORD}
    volumes:
      - prod_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${PROD_DB_USER:-movieapp} -p${PROD_DB_PASSWORD:?Set PROD_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: movieapp_prod_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  db_migrate:
    build:
      context: ./Backend
      dockerfile: Dockerfile.prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${PROD_DB_USER:-movieapp}
      DB_PASSWORD: ${PROD_DB_PASSWORD:?Set PROD_DB_PASSWORD}
      DB_NAME: ${PROD_DB_NAME:-movie_db}
    command: ["node", "src/database/migration-script.js"]

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      db_migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${PROD_BACKEND_PORT:-5200}:5000"
    environment:
      NODE_ENV: production
      APP_ENV: PRODUCTION
      PORT: 5000
      CLIENT_URL: ${PROD_CLIENT_URL:?Set PROD_CLIENT_URL}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${PROD_DB_USER:-movieapp}
      DB_PASSWORD: ${PROD_DB_PASSWORD:?Set PROD_DB_PASSWORD}
      DB_NAME: ${PROD_DB_NAME:-movie_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${PROD_JWT_SECRET:?Set PROD_JWT_SECRET}
      JWT_REFRESH_SECRET: ${PROD_JWT_REFRESH_SECRET:?Set PROD_JWT_REFRESH_SECRET}
      JWT_ACCESS_TOKEN_EXPIRES_IN: ${PROD_JWT_ACCESS_TOKEN_EXPIRES_IN:-1h}
      JWT_REFRESH_TOKEN_EXPIRES_IN: ${PROD_JWT_REFRESH_TOKEN_EXPIRES_IN:-12h}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${PROD_PUBLIC_API_URL:?Set PROD_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PROD_FRONTEND_PORT:-3200}:3000"
    environment:
      BACKEND_INTERNAL_URL: http://backend:5000
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  prod_db_data:
  prod_redis_data:
