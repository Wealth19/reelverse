name: movieapp-staging

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${STAGING_DB_ROOT_PASSWORD:?Set STAGING_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${STAGING_DB_NAME:-movie_db_staging}
      MYSQL_USER: ${STAGING_DB_USER:-movieapp_staging}
      MYSQL_PASSWORD: ${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD}
    volumes:
      - staging_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${STAGING_DB_USER:-movieapp_staging} -p${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: movieapp_staging_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  db_migrate:
    build:
      context: ./Backend
      dockerfile: Dockerfile.prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${STAGING_DB_USER:-movieapp_staging}
      DB_PASSWORD: ${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD}
      DB_NAME: ${STAGING_DB_NAME:-movie_db_staging}
    command: ["node", "src/database/migration-script.js"]

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.prod
    depends_on:
      db_migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${STAGING_BACKEND_PORT:-5100}:5000"
    environment:
      NODE_ENV: production
      APP_ENV: ${STAGING_APP_ENV:-production}
      PORT: 5000
      CLIENT_URL: ${STAGING_CLIENT_URL:-http://127.0.0.1:3100}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${STAGING_DB_USER:-movieapp_staging}
      DB_PASSWORD: ${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD}
      DB_NAME: ${STAGING_DB_NAME:-movie_db_staging}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${STAGING_JWT_SECRET:?Set STAGING_JWT_SECRET}
      JWT_REFRESH_SECRET: ${STAGING_JWT_REFRESH_SECRET:?Set STAGING_JWT_REFRESH_SECRET}
      JWT_ACCESS_TOKEN_EXPIRES_IN: ${STAGING_JWT_ACCESS_TOKEN_EXPIRES_IN:-1h}
      JWT_REFRESH_TOKEN_EXPIRES_IN: ${STAGING_JWT_REFRESH_TOKEN_EXPIRES_IN:-12h}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${STAGING_PUBLIC_API_URL:-http://127.0.0.1:5100/api}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${STAGING_FRONTEND_PORT:-3100}:3000"
    environment:
      BACKEND_INTERNAL_URL: http://backend:5000
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  staging_db_data:
  staging_redis_data:
