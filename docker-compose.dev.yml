name: movieapp-dev

services:
  db:
    image: mysql:8.0
    container_name: movieapp_dev_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: movie_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - dev_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: movieapp_dev_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  db_migrate:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: movieapp_dev_db_migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: movie_db
    command: ["npm", "run", "migration:run"]

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: movieapp_dev_backend
    depends_on:
      db_migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: movie_db
      REDIS_URL: redis://redis:6379
    command: ["npm", "run", "dev", "--", "-L"]
    volumes:
      - ./Backend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    container_name: movieapp_dev_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      BACKEND_INTERNAL_URL: http://backend:5000
    command: ["npm", "run", "dev", "--", "--webpack"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stdin_open: true
    tty: true

volumes:
  dev_db_data:
  dev_redis_data:
